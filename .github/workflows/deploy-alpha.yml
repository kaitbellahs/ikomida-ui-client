name: PROJX ALPHA PIPELINE
on:
  push:
    branches:
      - development
  workflow_dispatch:
jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install dependencies
        run: >
          npm install
          npm test
          npm run build
          npx cap copy
      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.2'
      - name: setup and run fastlane, and run deploy-alpha lane
        uses: maierj/fastlane-action@v2.2.0
        with:
          lane: 'deploy-alpha'
          subdirectory: 'android'